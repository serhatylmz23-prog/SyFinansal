<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SyFinans Otağı v5.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
:root {
  --bg: #0a0a0f; --bg2: #12121a; --bg3: #1a1a25;
  --border: rgba(255, 255, 255, 0.1); --text: #e8e8ef; --text2: #a0a0b0;
  --primary: #667eea; --primary-2: #764ba2; --success: #10b981; --danger: #ef4444;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
body { background: var(--bg); color: var(--text); height:100vh; overflow:hidden; }

/* Aktivasyon Ekranı */
#activation-overlay {
  position:fixed; inset:0; background:var(--bg); z-index:99999;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.act-card {
  background:var(--bg2); border:1px solid var(--primary); border-radius:18px;
  padding:24px; max-width:380px; width:100%; text-align:center; box-shadow:0 0 30px rgba(102,126,234,0.3);
}
.input-field {
  width:100%; padding:12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg3); color:#fff; margin:10px 0; text-align:center; font-weight:700; outline:none;
}
.btn {
  width:100%; padding:12px; border-radius:10px; border:none; font-weight:600; cursor:pointer; margin-bottom:8px;
}
.btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; }
.btn-success { background:var(--success); color:#fff; }

/* Uygulama Ekranı */
#app-shell { display:none; flex-direction:column; height:100vh; }
.header { padding:14px 20px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:18px; color:var(--primary); }
.banner { background:#000; color:#a0a0b0; font-size:11px; padding:6px 12px; text-align:center; border-bottom:1px solid var(--border); }
.content { flex:1; padding:16px; overflow-y:auto; }
.card { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
.tabs { display:flex; gap:8px; padding:10px; background:var(--bg2); overflow-x:auto; border-bottom:1px solid var(--border); }
.tab { padding:6px 14px; border-radius:16px; background:var(--bg3); color:var(--text2); font-size:12px; border:1px solid var(--border); white-space:nowrap; }
.tab.active { background:var(--primary); color:#fff; }
</style>
</head>
<body>

<div id="activation-overlay">
  <div class="act-card">
    <div style="font-size:36px; margin-bottom:10px;">🔐</div>
    <h2 style="font-size:18px; margin-bottom:6px;">SyFinans Cihaz Aktivasyonu</h2>
    <p style="font-size:12px; color:var(--text2); margin-bottom:16px;">Aktivasyon kodu <b>serhatylmz23@hotmail.com</b> adresine gönderilecektir.</p>
    <button class="btn btn-primary" onclick="app.requestActivationCode()">📩 Aktivasyon Kodu İste</button>
    <input type="text" class="input-field" id="activation-code-input" placeholder="SYF-XXXXXX">
    <button class="btn btn-success" onclick="app.verifyActivationCode()">✅ Cihazı Aktifleştir</button>
  </div>
</div>

<div id="app-shell">
  <div class="banner">⚠️ TÜM İŞLEMLER SANAL SİMÜLASYONDUR. GERÇEK MADDİ DEĞER TAŞIMAZ.</div>
  <div class="header">
    <h1>SyFinans Otağı v5.1</h1>
    <button style="background:none; border:none; font-size:20px; cursor:pointer;" onclick="app.toggleHandsFreeMic()">🎙️</button>
  </div>
  <div class="tabs">
    <div class="tab active">📈 Piyasa</div>
    <div class="tab">💼 Kasam</div>
    <div class="tab">🧠 Kaşif AI</div>
    <div class="tab">🎯 Analiz</div>
    <div class="tab">🚨 Afet</div>
    <div class="tab">🛣️ Yol</div>
  </div>
  <div class="content">
    <div class="card">
      <div style="font-size:12px; color:var(--text2);">BIST 100 CANLI TAKİP</div>
      <div style="font-size:24px; font-weight:800; margin-top:4px;">9.847,32 ₺</div>
    </div>
  </div>
</div>

<script src="./js/app.js"></script>
</body>
</html>
